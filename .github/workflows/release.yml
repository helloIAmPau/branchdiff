name: release

# Publish binaries to a GitHub Release when a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Create the GitHub Release for the tag first, so the matrix jobs upload to it.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          # Release title/body are derived from the tag; edit later on GitHub if desired.
          title: branchdiff $tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Builds `branchdiff` in release mode for the target, packages it
      # (tar.gz on unix, zip on windows), generates a sha256 checksum, and
      # uploads everything to the release for this tag. Linux cross-targets are
      # handled automatically via the cross toolchain.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: branchdiff
          target: ${{ matrix.target }}
          archive: branchdiff-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
